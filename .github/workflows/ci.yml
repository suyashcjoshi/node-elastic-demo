name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skyward
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (node --check)
        run: find . -name "*.js" -not -path "./node_modules/*" -exec node --check {} \;

      - name: Seed database
        run: cp .env.example .env && npm run seed
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/skyward

      - name: Run smoke tests
        run: npm test
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/skyward
